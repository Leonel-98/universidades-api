spring.application.name=universidades-api
server.port=${PORT:8080}

# Base de datos (variables de entorno en Render; valores por defecto para local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/universidades}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Correo (Brevo por API HTTP)
app.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Universidades App
